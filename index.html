<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MALIK PUBG MART</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #000000, #001f3f);
      color: white;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
    }
    .title-container {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 80px;
      color: white;
      text-shadow: 4px 4px 8px rgba(0, 255, 255, 0.5),
                   0 0 25px rgba(0, 255, 255, 0.6),
                   0 0 50px rgba(0, 255, 255, 0.7);
      animation: glow 2s infinite alternate;
      font-family: 'Arial', sans-serif;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #ffffff; }
      to { text-shadow: 0 0 20px #00ffff; }
    }
    .product-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      margin-bottom: 30px;
    }
    .product-button {
      background-color: #111;
      border: 2px solid #00ffff;
      border-radius: 15px;
      padding: 10px;
      width: 180px;
      height: 180px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .product-button:hover {
      transform: scale(1.05);
    }
    .product-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }
    .content {
      display: flex;
      justify-content: center;
      gap: 30px;
      align-items: center;
      width: 100%;
    }
    .product-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 40%;
      transition: transform 0.5s ease;
    }
    .ratelist-section {
      display: none;
      width: 40%;
      text-align: center;
      transition: opacity 0.5s ease;
    }
    .ratelist-section img {
      width: 100%;
      border: 3px solid #00ffff;
      border-radius: 15px;
    }
    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 999;
    }
    .contact-info {
      margin-top: 50px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Title Section -->
  <div class="title-container">
    <h1>MALIK PUBG MART</h1>
  </div>

  <!-- Main Content: Product Buttons & Rate List Section -->
  <div class="content">
    <!-- Product Section -->
    <div class="product-section" id="productSection">
      <div class="product-buttons">
        <div class="product-button" onclick="showRateList('uc')">
          <img src="https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/pubg%20uc.jpg" alt="PUBG UC">
        </div>
        <div class="product-button" onclick="showRateList('accounts')">
          <img src="https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/pubg%20accounts.jpg" alt="PUBG Accounts">
        </div>
        <div class="product-button" onclick="showRateList('popularity')">
          <img src="https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/populatory%20battle.jpg" alt="Popularity Battle">
        </div>
        <div class="product-button" onclick="showRateList('homevotes')">
          <img src="https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/pubg%20homevotes.jpg" alt="Home Votes">
        </div>
        <div class="product-button" onclick="showRateList('ludo')">
          <img src="https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/yalla%20ludo.jpg" alt="Yalla Ludo">
        </div>
      </div>
    </div>

    <!-- Rate List Section -->
    <div class="ratelist-section" id="ratelistSection">
      <img id="ratelist-img" src="" alt="Rate List">
    </div>
  </div>

  <!-- WhatsApp Chat Button -->
  <a class="whatsapp-button" href="https://wa.me/923057913067" target="_blank">💬</a>

  <!-- Contact Info -->
  <div class="contact-info">
    <p>Contact: 0305 7913067</p>
    <p>Email: arslanmm425@gmail.com</p>
  </div>

  <script>
    function showRateList(type) {
      let img = document.getElementById("ratelist-img");
      let box = document.getElementById("ratelistSection");
      let productSection = document.getElementById("productSection");

      if (type === "uc") {
        img.src = "https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/UC%20RATELIST.jpeg";
      } else if (type === "ludo") {
        img.src = "https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/LUDO%20RATELIST.jpeg";
      } else {
        img.src = "";
        box.style.display = "none";
        productSection.style.transform = "scale(1)";
        return;
      }

      box.style.display = "block";
      productSection.style.transform = "scale(0.7)"; // Shrink product button section
    }
  </script>

</body>
</html>
