<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MALIK PUBG MART</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(135deg, #000000, #001f3f);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      color: white;
      animation: glow 2s infinite alternate;
      margin-top: 20px;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ffffff; }
      to { text-shadow: 0 0 20px #00ffff; }
    }

    .product-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: 30px auto;
    }

    .product-button {
      background-color: #111;
      border: 2px solid transparent;
      border-radius: 20px;
      padding: 10px;
      width: 300px;
      height: 160px;
      cursor: pointer;
      transition: all 0.4s ease;
      overflow: hidden;
      position: relative;
    }

    .product-button:hover {
      border: 2px solid #00ffff;
      box-shadow: 0 0 15px #00ffff;
      transform: scale(1.03);
    }

    .product-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      transition: transform 0.4s;
    }

    .product-button.active {
      width: 150px;
      height: 100px;
    }

    .ratelist-image {
      margin: 30px auto;
      display: none;
      animation: fadeIn 1s forwards;
    }

    .ratelist-image img {
      width: 95%;
      max-width: 700px;
      border: 4px solid #00ffff;
      border-radius: 15px;
      transition: transform 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 999;
    }

    .contact-info {
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <h1>MALIK PUBG MART</h1>

  <div class="product-buttons">
    <div class="product-button" onclick="showRateList(event, 'uc')">
      <img src="https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/pubg%20uc.jpg" alt="PUBG UC">
    </div>
    <div class="product-button" onclick="showRateList(event, 'accounts')">
      <img src="https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/pubg%20accounts.jpg" alt="PUBG Accounts">
    </div>
    <div class="product-button" onclick="showRateList(event, 'popularity')">
      <img src="https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/populatory%20battle.jpg" alt="Popularity Battle">
    </div>
    <div class="product-button" onclick="showRateList(event, 'homevotes')">
      <img src="https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/pubg%20homevotes.jpg" alt="Home Votes">
    </div>
    <div class="product-button" onclick="showRateList(event, 'ludo')">
      <img src="https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/yalla%20ludo.jpg" alt="Yalla Ludo">
    </div>
  </div>

  <div class="ratelist-image" id="ratelist">
    <img id="ratelist-img" src="" alt="Rate List">
  </div>

  <a class="whatsapp-button" href="https://wa.me/923057913067" target="_blank">💬</a>

  <div class="contact-info">
    <p>Contact: 0305 7913067</p>
    <p>Email: arslanmm425@gmail.com</p>
  </div>

  <script>
    function showRateList(event, type) {
      const img = document.getElementById("ratelist-img");
      const box = document.getElementById("ratelist");
      const buttons = document.querySelectorAll(".product-button");

      // Reset all buttons
      buttons.forEach(btn => btn.classList.remove("active"));

      // Highlight clicked product
      event.currentTarget.classList.add("active");

      // Set rate list image
      if (type === "uc") {
        img.src = "https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/UC%20RATELIST.jpeg";
      } else if (type === "ludo") {
        img.src = "https://raw.githubusercontent.com/arslanmalik999/PUBG-STORE-BY-MALIK/main/assets/images/LUDO%20RATELIST.jpeg";
      } else if (type === "accounts") {
        img.src = "https://via.placeholder.com/600x400?text=Accounts+Rate+List";
      } else if (type === "popularity") {
        img.src = "https://via.placeholder.com/600x400?text=Popularity+Rate+List";
      } else if (type === "homevotes") {
        img.src = "https://via.placeholder.com/600x400?text=HomeVotes+Rate+List";
      } else {
        img.src = "";
        box.style.display = "none";
        return;
      }

      box.style.display = "block";
    }
  </script>
</body>
</html>
